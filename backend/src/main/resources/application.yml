spring:
  application:
    name: ecomm-showcase-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local-h2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ecomm.showcase: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: INFO
