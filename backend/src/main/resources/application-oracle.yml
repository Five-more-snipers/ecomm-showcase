spring:
  datasource:
    url: jdbc:oracle:thin:@${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE_NAME:FREEPDB1}
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${DB_USERNAME:ecomm_user}
    password: ${DB_PASSWORD:ecomm_password}
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    show-sql: false
