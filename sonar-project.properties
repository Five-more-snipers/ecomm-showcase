sonar.projectKey=Five-more-snipers_ecomm-showcase
sonar.organization=five-more-snipers

# Source directories for analysis
sonar.sources=backend/src/main/java,frontend/src
sonar.tests=backend/src/test/java

# Java bytecode and source level for SonarQube Java Analyzer
sonar.java.binaries=backend/target/classes
sonar.java.source=21

# Exclude dependencies, compiled artifacts, and references
sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/design-reference/**,**/github_stock/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8